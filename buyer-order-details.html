<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل الطلب | بوابة المشتري - عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="stylesheet" href="css/products.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="css/orders.css" />
  <link rel="stylesheet" href="css/buyer.css" />
</head>
<body>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar"></aside>

    <main class="dash-main">
      <header class="top-navbar">
        <div class="user-profile">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name" id="dashCompanyName">المشتري</span>
            <span class="user-role">حساب مشترٍ</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="index.html" class="refresh-btn" style="text-decoration: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M15 3h6v6"/><path d="M10 21H4v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            الرئيسية للموقع
          </a>
        </div>
      </header>

      <div class="dash-body">
        <div class="page-header">
          <div>
            <a href="buyer-orders.html" class="ord-link" style="font-size:0.84rem;display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              العودة إلى طلباتي
            </a>
            <h1 class="page-title" id="bdTitle">تفاصيل الطلب</h1>
            <p class="page-subtitle" id="bdSubtitle">جارٍ التحميل…</p>
          </div>
        </div>

        <div class="ord-state" id="bdLoading">
          <span class="ord-spinner"></span>
          <strong>جارٍ تحميل تفاصيل الطلب…</strong>
        </div>

        <div class="ord-state" id="bdNotFound" hidden>
          <span class="ord-state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </span>
          <strong>لم يُعثر على هذا الطلب</strong>
          <p>ربما الرابط غير صحيح أو أن الطلب لا يخصّ حسابك.</p>
          <a class="ob-btn-secondary" href="buyer-orders.html" style="text-decoration:none;">العودة إلى طلباتي</a>
        </div>

        <div id="bdContent" hidden>
          <div id="bdAlerts"></div>

          <div class="ord-detail-grid">
            <div>
              <div class="ord-card">
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                  <h3>المنتجات</h3>
                </div>
                <div style="overflow-x:auto;">
                  <table class="ord-items-table">
                    <thead><tr><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead>
                    <tbody id="bdItems"></tbody>
                  </table>
                </div>
                <div class="ord-totals" id="bdTotals"></div>
              </div>

              <div class="ord-card">
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  <h3>تتبع الشحنة</h3>
                </div>
                <div class="ord-timeline" id="bdTimeline"></div>
              </div>
            </div>

            <div>
              <div class="ord-card">
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                  <h3>الشحن والتوصيل</h3>
                </div>
                <div class="ord-info-list" id="bdShipping"></div>
              </div>

              <div class="ord-card">
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                  <h3>الدفع</h3>
                </div>
                <div class="ord-info-list" id="bdPayment"></div>
              </div>

              <div class="ord-card">
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                  <h3>إجراءات</h3>
                </div>
                <div class="ord-actions" id="bdActions"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/buyer.js"></script>
  <script src="js/buyer-shell.js"></script>
  <script src="js/buyer-order-details.js"></script>
</body>
</html>
