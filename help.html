<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مركز المساعدة | بوابة الموردين - عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="stylesheet" href="css/products.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="css/ammar-theme.css" />
  <script>
    if (localStorage.getItem('ammar_supplier_onboarded') !== 'true') {
      window.location.replace('onboarding.html');
    }
  </script>
</head>
<body>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar"></aside>

    <main class="dash-main">
      <header class="top-navbar">
        <div class="user-profile">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name" id="dashCompanyName">شركة البناء الحديث</span>
            <span class="user-role">مورد معتمد</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="index.html" class="refresh-btn" style="text-decoration: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M15 3h6v6"/><path d="M10 21H4v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            الرئيسية للموقع
          </a>
        </div>
      </header>

      <div class="dash-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">مركز المساعدة</h1>
            <p class="page-subtitle">إجابات سريعة، وتذاكر دعم فني، وتواصل مباشر مع فريق عمّار</p>
          </div>
        </div>

        <div style="display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;">
          <button type="button" class="ob-btn-secondary" id="helpChatBtn" style="display:flex;align-items:center;gap:8px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            دردشة مباشرة
          </button>
          <button type="button" class="ob-btn-secondary" id="helpCallBtn" style="display:flex;align-items:center;gap:8px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            اتصل بالدعم
          </button>
          <button type="button" class="pd-add-btn" id="helpNewTicketBtn" style="margin-inline-start:auto;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            فتح تذكرة جديدة
          </button>
        </div>

        <div class="chart-grid">
          <div class="chart-card">
            <div class="pd-subhead" style="margin-top:0;"><strong>الأسئلة الشائعة</strong></div>
            <div id="faqList"><!-- JS-populated --></div>
          </div>

          <div class="chart-card">
            <div class="pd-subhead" style="margin-top:0;"><strong>تذاكر الدعم الفني</strong></div>
            <div id="ticketList"><!-- JS-populated --></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Ticket Modal -->
  <div class="pd-modal-overlay" id="ticketModalOverlay" hidden>
    <div class="pd-modal" style="max-width:480px;">
      <div class="pd-modal-header">
        <h2>فتح تذكرة دعم جديدة</h2>
        <button type="button" class="pd-modal-close" id="ticketModalClose" aria-label="إغلاق">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="pd-modal-body">
        <div class="pd-field">
          <label for="tkSubject">الموضوع <em>*</em></label>
          <input type="text" id="tkSubject" placeholder="مثال: مشكلة في رفع صور المنتج" />
        </div>
        <div class="pd-field">
          <label for="tkCategory">التصنيف</label>
          <select id="tkCategory">
            <option>مشكلة تقنية</option>
            <option>استفسار عن الفواتير</option>
            <option>استفسار عن الطلبات</option>
            <option>أخرى</option>
          </select>
        </div>
        <div class="pd-field">
          <label for="tkMessage">تفاصيل المشكلة <em>*</em></label>
          <textarea id="tkMessage" placeholder="اشرح المشكلة بالتفصيل..."></textarea>
        </div>
      </div>
      <div class="pd-modal-footer">
        <div class="pd-modal-footer-start">
          <button type="button" class="ob-btn-ghost" id="ticketCancelBtn">إلغاء</button>
        </div>
        <div class="pd-modal-footer-end">
          <button type="button" class="ob-btn-primary" id="ticketSubmitBtn">إرسال التذكرة</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/session.js"></script>
  <script src="js/store.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/help.js"></script>
</body>
</html>
