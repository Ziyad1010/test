<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المستخدمين والصلاحيات | بوابة الموردين - عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="stylesheet" href="css/products.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <script>
    if (localStorage.getItem('ammar_supplier_onboarded') !== 'true') {
      window.location.replace('onboarding.html');
    }
  </script>
</head>
<body>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar"></aside>

    <main class="dash-main">
      <header class="top-navbar">
        <div class="user-profile">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name" id="dashCompanyName">شركة البناء الحديث</span>
            <span class="user-role">مورد معتمد</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="index.html" class="refresh-btn" style="text-decoration: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M15 3h6v6"/><path d="M10 21H4v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            الرئيسية للموقع
          </a>
        </div>
      </header>

      <div class="dash-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">المستخدمين والصلاحيات</h1>
            <p class="page-subtitle">إدارة فريق العمل وصلاحيات الوصول للوحة التحكم</p>
          </div>
          <button class="pd-add-btn" id="usrInviteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
            دعوة مستخدم
          </button>
        </div>

        <div class="pd-table-wrap" style="margin-bottom:24px;">
          <table class="pd-table">
            <thead>
              <tr>
                <th>الاسم</th>
                <th>البريد الإلكتروني</th>
                <th>الدور</th>
                <th>الحالة</th>
                <th>آخر نشاط</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="usrTableBody"><!-- JS-populated --></tbody>
          </table>
        </div>

        <div class="panel-card">
          <div class="panel-header">
            <h2 class="panel-title">مصفوفة الصلاحيات</h2>
            <p class="page-subtitle" style="margin:0;">تحديد ما يمكن لكل دور الوصول إليه</p>
          </div>
          <div class="perm-table-wrap">
            <table class="perm-table" id="permTable"><!-- JS-populated --></table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Invite User Modal -->
  <div class="pd-modal-overlay" id="usrModalOverlay" hidden>
    <div class="pd-modal" style="max-width:480px;">
      <div class="pd-modal-header">
        <h2>دعوة مستخدم جديد</h2>
        <button type="button" class="pd-modal-close" id="usrModalClose" aria-label="إغلاق">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="pd-modal-body">
        <div class="pd-field">
          <label for="usrName">الاسم الكامل</label>
          <input type="text" id="usrName" placeholder="سعود الحربي" />
        </div>
        <div class="pd-field">
          <label for="usrEmail">البريد الإلكتروني <em>*</em></label>
          <input type="email" id="usrEmail" placeholder="name@example.sa" />
        </div>
        <div class="pd-field">
          <label for="usrRole">الدور</label>
          <select id="usrRole">
            <option value="admin">مدير</option>
            <option value="sales">مبيعات</option>
            <option value="warehouse">مستودعات</option>
            <option value="finance">مالية</option>
            <option value="readonly">قراءة فقط</option>
          </select>
        </div>
      </div>
      <div class="pd-modal-footer">
        <div class="pd-modal-footer-start">
          <button type="button" class="ob-btn-ghost" id="usrCancelBtn">إلغاء</button>
        </div>
        <div class="pd-modal-footer-end">
          <button type="button" class="ob-btn-primary" id="usrSendBtn">إرسال الدعوة</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shell.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
