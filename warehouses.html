<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المستودعات | بوابة الموردين - عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="stylesheet" href="css/products.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="css/ammar-theme.css" />
  <script>
    if (localStorage.getItem('ammar_supplier_onboarded') !== 'true') {
      window.location.replace('onboarding.html');
    }
  </script>
</head>
<body>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar"></aside>

    <main class="dash-main">
      <header class="top-navbar">
        <div class="user-profile">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name" id="dashCompanyName">شركة البناء الحديث</span>
            <span class="user-role">مورد معتمد</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="index.html" class="refresh-btn" style="text-decoration: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M15 3h6v6"/><path d="M10 21H4v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            الرئيسية للموقع
          </a>
        </div>
      </header>

      <div class="dash-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">المستودعات</h1>
            <p class="page-subtitle">إدارة مستودعاتك ومتابعة حركة المخزون بين الفروع</p>
          </div>
          <a href="onboarding.html?step=4" class="pd-add-btn" style="text-decoration:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            إضافة مستودع
          </a>
        </div>

        <div class="card-grid" id="whGrid"><!-- JS-populated --></div>

        <div class="tab-bar" id="whTabs">
          <button type="button" class="tab-btn is-active" data-tab="inventory">المخزون</button>
          <button type="button" class="tab-btn" data-tab="incoming">الوارد</button>
          <button type="button" class="tab-btn" data-tab="outgoing">الصادر</button>
          <button type="button" class="tab-btn" data-tab="transfers">التحويلات بين المستودعات</button>
        </div>

        <div class="pd-table-wrap">
          <table class="pd-table" id="whTable">
            <thead id="whTableHead"></thead>
            <tbody id="whTableBody"><!-- JS-populated --></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/session.js"></script>
  <script src="js/store.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/warehouses.js"></script>
</body>
</html>
