<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التقارير | بوابة الموردين - عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="stylesheet" href="css/products.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <script>
    if (localStorage.getItem('ammar_supplier_onboarded') !== 'true') {
      window.location.replace('onboarding.html');
    }
  </script>
</head>
<body>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar"></aside>

    <main class="dash-main">
      <header class="top-navbar">
        <div class="user-profile">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name" id="dashCompanyName">شركة البناء الحديث</span>
            <span class="user-role">مورد معتمد</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="index.html" class="refresh-btn" style="text-decoration: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M15 3h6v6"/><path d="M10 21H4v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            الرئيسية للموقع
          </a>
        </div>
      </header>

      <div class="dash-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">التقارير</h1>
            <p class="page-subtitle">أنشئ تقارير مفصلة عن مبيعاتك ومخزونك وعملائك</p>
          </div>
        </div>

        <div class="report-config">
          <div class="pd-field-row cols-3">
            <div class="pd-field">
              <label for="repType">نوع التقرير</label>
              <select id="repType">
                <option value="sales">تقرير المبيعات</option>
                <option value="inventory">تقرير المخزون</option>
                <option value="orders">تقرير الطلبات</option>
                <option value="customers">تقرير العملاء</option>
              </select>
            </div>
            <div class="pd-field">
              <label for="repFromDay">من تاريخ</label>
              <div class="ob-date-group" data-date-for="repFrom">
                <input type="text" id="repFromDay" data-part="day" inputmode="numeric" maxlength="2" placeholder="يوم" aria-label="اليوم" />
                <span class="ob-date-sep">/</span>
                <input type="text" data-part="month" inputmode="numeric" maxlength="2" placeholder="شهر" aria-label="الشهر" />
                <span class="ob-date-sep">/</span>
                <input type="text" data-part="year" inputmode="numeric" maxlength="4" placeholder="سنة" aria-label="السنة" />
                <input type="hidden" id="repFrom" value="2026-07-01" />
              </div>
            </div>
            <div class="pd-field">
              <label for="repToDay">إلى تاريخ</label>
              <div class="ob-date-group" data-date-for="repTo">
                <input type="text" id="repToDay" data-part="day" inputmode="numeric" maxlength="2" placeholder="يوم" aria-label="اليوم" />
                <span class="ob-date-sep">/</span>
                <input type="text" data-part="month" inputmode="numeric" maxlength="2" placeholder="شهر" aria-label="الشهر" />
                <span class="ob-date-sep">/</span>
                <input type="text" data-part="year" inputmode="numeric" maxlength="4" placeholder="سنة" aria-label="السنة" />
                <input type="hidden" id="repTo" value="2026-07-26" />
              </div>
            </div>
          </div>
          <div class="ob-actions" style="border-top:none;padding-top:0;margin-top:4px;">
            <button type="button" class="ob-btn-primary" id="repGenerateBtn">إنشاء التقرير</button>
          </div>
        </div>

        <div id="repResult" hidden>
          <div class="panel-card" style="margin-bottom:20px;">
            <div class="panel-header">
              <div>
                <h2 class="panel-title" id="repTitle">تقرير المبيعات</h2>
                <p class="page-subtitle" id="repRange" style="margin-top:2px;"></p>
              </div>
              <div style="display:flex;gap:10px;">
                <button type="button" class="ob-btn-secondary" id="repExportCsv">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  تصدير Excel (CSV)
                </button>
                <button type="button" class="ob-btn-secondary" id="repExportPdf">تصدير PDF</button>
              </div>
            </div>
            <div class="pd-table-wrap" style="box-shadow:none;border:1px solid var(--line);">
              <table class="pd-table">
                <thead id="repTableHead"></thead>
                <tbody id="repTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/shell.js"></script>
  <script src="js/date-field.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
