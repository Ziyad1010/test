<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المنتج | بوابة المشتري - عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="stylesheet" href="css/products.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="css/orders.css" />
  <link rel="stylesheet" href="css/buyer.css" />
</head>
<body>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar"></aside>

    <main class="dash-main">
      <header class="top-navbar">
        <div class="user-profile">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name" id="dashCompanyName">المشتري</span>
            <span class="user-role">حساب مشترٍ</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="index.html" class="refresh-btn" style="text-decoration: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M15 3h6v6"/><path d="M10 21H4v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            الرئيسية للموقع
          </a>
        </div>
      </header>

      <div class="dash-body">
        <div class="page-header">
          <div>
            <a href="buyer-home.html" class="ord-link" style="font-size:0.84rem;display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              العودة إلى المتجر
            </a>
            <h1 class="page-title" id="bpName">تفاصيل المنتج</h1>
            <p class="page-subtitle" id="bpSubtitle">جارٍ التحميل…</p>
          </div>
        </div>

        <div class="ord-state" id="bpLoading">
          <span class="ord-spinner"></span>
          <strong>جارٍ تحميل المنتج…</strong>
        </div>

        <div class="ord-state" id="bpNotFound" hidden>
          <span class="ord-state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </span>
          <strong>لم يُعثر على هذا المنتج</strong>
          <p>ربما لم يعد متاحاً في المتجر.</p>
          <a class="ob-btn-secondary" href="buyer-home.html" style="text-decoration:none;">العودة إلى المتجر</a>
        </div>

        <div id="bpContent" hidden>
          <div class="ord-detail-grid">
            <div>
              <div class="ord-card">
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                  <h3>صور المنتج</h3>
                </div>
                <div class="pd-media-grid" id="bpGallery"></div>
              </div>

              <div class="ord-card">
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                  <h3>المواصفات</h3>
                </div>
                <div class="ord-info-list" id="bpSpecs"></div>
              </div>

              <div class="ord-card" id="bpReviewCard">
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                  <h3>تقييمك لهذا المنتج</h3>
                </div>
                <div id="bpReview"></div>
              </div>
            </div>

            <div>
              <div class="ord-card">
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                  <h3>السعر والتوفر</h3>
                </div>
                <div class="ord-info-list" id="bpPricing"></div>
                <div class="ord-actions" id="bpActions" style="margin-top:16px;"></div>
              </div>

              <div class="ord-card" id="bpTiersCard" hidden>
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                  <h3>خصم الكميات</h3>
                </div>
                <div class="ord-info-list" id="bpTiers"></div>
              </div>

              <div class="ord-card" id="bpHistoryCard" hidden>
                <div class="ord-card-head">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  <h3>مشترياتك السابقة</h3>
                </div>
                <div class="ord-info-list" id="bpHistory"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/buyer.js"></script>
  <script src="js/buyer-shell.js"></script>
  <script src="js/buyer-product.js"></script>
</body>
</html>
