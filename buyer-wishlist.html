<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المفضلة | بوابة المشتري - عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="stylesheet" href="css/products.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="css/orders.css" />
  <link rel="stylesheet" href="css/buyer.css" />
</head>
<body>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar"></aside>

    <main class="dash-main">
      <header class="top-navbar">
        <div class="user-profile">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name" id="dashCompanyName">المشتري</span>
            <span class="user-role">حساب مشترٍ</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="index.html" class="refresh-btn" style="text-decoration: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M15 3h6v6"/><path d="M10 21H4v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            الرئيسية للموقع
          </a>
        </div>
      </header>

      <div class="dash-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">المفضلة</h1>
            <p class="page-subtitle">منتجات حفظتها للشراء لاحقاً</p>
          </div>
        </div>

        <div class="ord-state" id="bwLoading">
          <span class="ord-spinner"></span>
          <strong>جارٍ تحميل المفضلة…</strong>
        </div>

        <div class="pd-grid" id="bwGrid" hidden></div>

        <div class="ord-state" id="bwEmpty" hidden>
          <span class="ord-state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </span>
          <strong>قائمة المفضلة فارغة</strong>
          <p>احفظ المنتجات التي تهمّك بالضغط على أيقونة القلب لتجدها هنا لاحقاً.</p>
          <a class="ob-btn-secondary" href="buyer-home.html" style="text-decoration:none;">تصفّح المنتجات</a>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/buyer.js"></script>
  <script src="js/buyer-shell.js"></script>
  <script src="js/buyer-wishlist.js"></script>
</body>
</html>
