<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقييماتي | بوابة المشتري - عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="stylesheet" href="css/products.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="css/orders.css" />
  <link rel="stylesheet" href="css/buyer.css" />
  <link rel="stylesheet" href="css/ammar-theme.css" />
  <link rel="stylesheet" href="css/storefront.css" />
  <link rel="stylesheet" href="css/buyer-smart.css" />
</head>
<body>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar"></aside>

    <main class="dash-main">
      <header class="top-navbar">
        <div class="user-profile">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name" id="dashCompanyName">المشتري</span>
            <span class="user-role">حساب مشترٍ</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="buyer-home.html" class="refresh-btn" style="text-decoration: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M15 3h6v6"/><path d="M10 21H4v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            العودة إلى المتجر
          </a>
        </div>
      </header>

      <div class="dash-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">تقييماتي ومراجعاتي</h1>
            <p class="page-subtitle">قيّم المنتجات التي استلمتها وشارك تجربتك</p>
          </div>
        </div>

        <div class="tab-bar" id="brTabs">
          <button type="button" class="tab-btn is-active" data-tab="pending">بانتظار التقييم</button>
          <button type="button" class="tab-btn" data-tab="done">تقييماتي السابقة</button>
        </div>

        <div class="ord-state" id="brLoading">
          <span class="ord-spinner"></span>
          <strong>جارٍ تحميل منتجاتك…</strong>
        </div>

        <div class="by-card-grid" id="brGrid" hidden></div>

        <div class="ord-state" id="brEmpty" hidden>
          <span class="ord-state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </span>
          <strong id="brEmptyTitle">لا توجد منتجات للتقييم</strong>
          <p id="brEmptyText">بعد استلام أي طلب ستتمكن من تقييم منتجاته هنا.</p>
          <a class="ob-btn-secondary" href="buyer-orders.html" style="text-decoration:none;">عرض طلباتي</a>
        </div>
      </div>
    </main>
  </div>

  <div class="pd-modal-overlay" id="brOverlay" hidden>
    <div class="pd-modal" style="max-width:520px;">
      <div class="pd-modal-header">
        <span class="pd-modal-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </span>
        <h2 id="brModalTitle">تقييم المنتج</h2>
        <button type="button" class="pd-modal-close" id="brClose" aria-label="إغلاق">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="pd-modal-body" id="brModalBody"></div>
      <div class="pd-modal-footer">
        <div class="pd-modal-footer-start">
          <button type="button" class="ob-btn-ghost" id="brCancel">إلغاء</button>
        </div>
        <div class="pd-modal-footer-end">
          <button type="button" class="ob-btn-primary" id="brSave">حفظ التقييم</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/buyer.js"></script>
  <script src="js/buyer-shell.js"></script>
  <script src="js/buyer-smart.js"></script>
  <script src="js/buyer-smart-ui.js"></script>
  <script src="js/buyer-live.js"></script>
  <script src="js/buyer-reviews.js"></script>
</body>
</html>
