<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-deco">
        <img src="assets/images/logo.png" alt="شعار عمار" />
        <h2>عمّار</h2>
      </div>

      <div class="auth-form-container">
        <a href="index.html" class="auth-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          العودة للرئيسية
        </a>

        <h1 class="auth-title">مرحباً بعودتك</h1>
        <p class="auth-subtitle">سجّل الدخول إلى حسابك في منصة عمار</p>

        <button class="auth-google-btn" onclick="handleGoogleSignIn()">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo" />
          المتابعة باستخدام Google
        </button>

        <div class="auth-divider">أو</div>

        <form class="auth-form" id="loginForm" onsubmit="handleLoginSubmit(event)">
          <div class="form-group">
            <label class="auth-label" for="email">البريد الإلكتروني</label>
            <input type="email" id="email" class="auth-input" placeholder="name@example.com" required />
          </div>

          <div class="form-group">
            <label class="auth-label" for="password">كلمة المرور</label>
            <input type="password" id="password" class="auth-input" placeholder="••••••••" required />
            <button type="button" class="password-toggle" aria-label="عرض كلمة المرور" onclick="togglePassword('password')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
          </div>

          <button type="submit" class="auth-btn">تسجيل الدخول</button>
        </form>

        <div class="auth-footer">
          ليس لديك حساب؟ <a href="signup.html">إنشاء حساب</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      window.location.href = 'index.html';
    }

    function handleGoogleSignIn() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
