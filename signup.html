<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب | عمار</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-deco">
        <img src="assets/images/logo.png" alt="شعار عمار" />
        <h2>عمّار</h2>
      </div>

      <div class="auth-form-container">
        <a href="index.html" class="auth-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          العودة للرئيسية
        </a>

        <h1 class="auth-title">إنشاء حساب جديد</h1>
        <p class="auth-subtitle">انضم لمنصة عمار كـ فرد أو كمورد بائع</p>

        <!-- Account Type Selection -->
        <div class="account-type-group">
          <label class="account-type-label">نوع الحساب المراد إنشاؤه</label>
          <div class="account-type-selector">
            <button type="button" class="account-type-btn active" id="btnBuyer" onclick="selectRole('buyer')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              أفراد / مشتري
            </button>
            <button type="button" class="account-type-btn" id="btnSupplier" onclick="selectRole('supplier')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              مورد / بائع
            </button>
          </div>
        </div>

        <button class="auth-google-btn" onclick="handleGoogleSignIn()">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo" />
          التسجيل باستخدام Google
        </button>

        <div class="auth-divider">أو</div>

        <form class="auth-form" id="signupForm" onsubmit="handleSignupSubmit(event)">
          <div class="form-group">
            <label class="auth-label" for="fullname">الاسم الكامل / اسم الشركة</label>
            <input type="text" id="fullname" class="auth-input" placeholder="محمد عبدالله أو شركة البناء" required />
          </div>

          <div class="form-group">
            <label class="auth-label" for="email">البريد الإلكتروني</label>
            <input type="email" id="email" class="auth-input" placeholder="name@example.com" required />
          </div>

          <div class="form-group">
            <label class="auth-label" for="phone">رقم الجوال</label>
            <input type="tel" id="phone" class="auth-input" placeholder="05XXXXXXXX" required />
          </div>

          <div class="form-group">
            <label class="auth-label" for="password">كلمة المرور</label>
            <input type="password" id="password" class="auth-input" placeholder="••••••••" required />
            <button type="button" class="password-toggle" aria-label="عرض كلمة المرور" onclick="togglePassword('password')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <div class="form-group">
            <label class="auth-label" for="confirm-password">تأكيد كلمة المرور</label>
            <input type="password" id="confirm-password" class="auth-input" placeholder="••••••••" required />
            <button type="button" class="password-toggle" aria-label="عرض كلمة المرور" onclick="togglePassword('confirm-password')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <label class="auth-checkbox">
            <input type="checkbox" required />
            أوافق على الشروط والأحكام وسياسة الخصوصية
          </label>

          <button type="submit" class="auth-btn">إنشاء حساب</button>
        </form>

        <div class="auth-footer">
          لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentRole = 'buyer';

    function selectRole(role) {
      currentRole = role;
      const btnBuyer = document.getElementById('btnBuyer');
      const btnSupplier = document.getElementById('btnSupplier');

      if (role === 'supplier') {
        btnSupplier.classList.add('active');
        btnBuyer.classList.remove('active');
      } else {
        btnBuyer.classList.add('active');
        btnSupplier.classList.remove('active');
      }
    }

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }

    function handleSignupSubmit(e) {
      e.preventDefault();
      if (currentRole === 'supplier') {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'index.html';
      }
    }

    function handleGoogleSignIn() {
      if (currentRole === 'supplier') {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
